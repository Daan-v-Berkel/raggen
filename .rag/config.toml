project_root = "/Users/daanvanberkel/Documents/Projects/ragboot"
schema_version = "v1"
notes = []

[scan]
use_gitignore = true
ignore = [".venv/", "node_modules/"]

[chunking]
strategy = "fixed"
unit = "chars"
chunk_size = 1200
overlap = 200

[embedding]
model_id = "sentence-transformers/all-MiniLM-L6-v2"
dim = 384
normalize = true
batch_size = 32

[storage]
backend_key = "sqlite_vec"
database_url = "sqlite:///./.rag/rag.db"
vector_backend_import = "raggen.core.store.vector_backends.sqlite_vec:SQLiteVecBackend"
destructive_default = false

[query]
model_id = ""

[rerank]
enabled = false
model_id = ""
top_n = 50
