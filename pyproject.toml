[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raggen"
version = "2026.0.1"
description = "CLI for local RAG — scan, chunk, embed, and query files semantically."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"numpy==2.4.2",
"pydantic==2.12.5",
"fastembed>=0.4.0",
"SQLAlchemy==2.0.48",
"sqlite-vec==0.1.6",
"fancy-dataclass==0.10.2",
"langchain-text-splitters==1.1.1",
]

authors = [
	{ name = "Daan van Berkel", email = "daanvb1990@hotmail.com" }
]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
  "rag",
  "retrieval-augmented-generation",
  "llm",
  "embeddings",
  "semantic-search",
  "vector-search",
  "onnx",
  "information-retrieval",
  "text-chunking",
  "document-indexing",
  "nlp",
  "local-llm",
  "knowledge-base",
  "sqlite",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
torch = ["sentence-transformers>=5.0"]
dev = [
"pytest",
"flake8",
"flake8-pyproject",
]
xml = ["pydantic-xml>=2.14,<3"]
postgres = ["psycopg2-binary>=2.9"]

[project.urls]
Homepage = "https://github.com/Daan-v-Berkel/raggen"
Repository = "https://github.com/Daan-v-Berkel/raggen"
Issues = "https://github.com/Daan-v-Berkel/raggen/issues"

[project.scripts]
rag = "raggen.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.flake8]
max-line-length = 120
exclude = ["__pycache__", ".git", "docs", ".venv"]
extend-ignore = ["E501"]
