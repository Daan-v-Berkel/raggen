[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raggen"
version = "2026.0.1"
description = "Local-first RAG pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"sqlite-vec",
"numpy==2.4.2",
"pydantic==2.12.5",
"sentence-transformers==5.2.3",
"SQLAlchemy==2.0.48",
"sqlite-vec==0.1.6",
"fancy-dataclass==0.10.2",
"langchain-text-splitters==1.1.1",
]

authors = [
	{ name = "Daan van Berkel", email = "daanvb1990@hotmail.com" }
]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
  "rag",
  "retrieval-augmented-generation",
  "llm",
  "embeddings",
  "information-retrieval",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Daan-v-Berkel/raggen"
Repository = "https://github.com/Daan-v-Berkel/raggen"
Issues = "https://github.com/Daan-v-Berkel/raggen/issues"

[project.scripts]
rag = "raggen.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
